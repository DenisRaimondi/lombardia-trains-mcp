# Builds and runs the tests against the live railway APIs.
#
# Those tests exist to notice when an upstream payload changes, which means they
# can fail for reasons that have nothing to do with a commit. That is the point,
# and it is also why they do not gate a release.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'      # Monday morning: catch upstream drift, not commits

jobs:
  test:
    # Three platforms because one of these is a real question, not a formality:
    # the clock is read as TimeZoneInfo.FindSystemTimeZoneById("Europe/Rome"),
    # an IANA name, and Windows keeps its own list. Everything this server says
    # about a departure depends on that lookup working.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build -c Release --nologo
      - run: dotnet test -c Release --nologo
